name: Parexa local model runtime

on:
  push:
    branches:
      - 'feature/parexa-local-model-runtime-*'
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: Offline model policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q main.py src/code tests
      - run: python -m unittest discover -s tests -p 'test_model_gateway.py' -v
      - run: |
          node --check website/static/script.js
          node --check website/static/observatory.js
          node --check website/static/model_selector.js
      - run: python -m unittest discover -s tests -p 'test_observatory_ui.py' -v

  adapter:
    name: LlamaIndex local adapter integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only lightweight model-adapter test dependencies
        run: python -m pip install 'llama-index-core>=0.13,<1' 'openai>=1,<3'
      - name: Fake local server HTTP integration (no cloud calls)
        run: python -m unittest discover -s tests -p 'test_local_chat_llm.py' -v
