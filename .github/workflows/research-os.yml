name: Research OS validation

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-contracts:
    name: Research OS / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight HTTP dependencies
        run: python -m pip install 'Flask>=3,<4' 'python-dotenv>=1,<2'
      - name: Compile research modules
        run: python -m compileall -q src/code/parexa_interface/storage/research_store.py src/code/parexa_interface/research_api.py
      - name: Exercise persistent research data and API contracts
        run: python -m unittest discover -s tests -p 'test_research_*.py' -v
      - name: Validate research UI JavaScript syntax
        run: node --check website/static/research-os.js
