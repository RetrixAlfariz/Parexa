# One-time audited branch cleanup. Only the designated main merge commit
# bearing [purge merged branches] can run this job.
# This workflow is removed from main after successful cleanup.
name: One-time Parexa branch consolidation cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prune-verified:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[purge merged branches]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit remote refs and delete only ancestor branches
        shell: bash
        run: |
          set -euo pipefail

          # Exact branches audited for October 2026 consolidation.
          branches=(
            "feature/parexa-local-model-runtime-2026-10"
            "feature/parexa-observatory-ui-2026-10"
            "polish/research-workspace-v1"
            "refactor/parexa-safety-foundation-2026-10"
            "maintenance/consolidate-to-main-2026-10"
          )
          expected=(
            "e50ea216973a32663715d196c6e254d60f1421ae"
            "dea805ce7ffd42e9a09c60f610fbf42c402fd7a8"
            "4107b476e9e4f0ccde600a22a82656e6dac7c842"
            "1671c21f8dbd71908a5f13b2165deae87f139e59"
            "" # Maintainer branch is created by this PR and has no static tip SHA.
          )

          remote_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "Aborting: main advanced during cleanup." >&2
            exit 1
          fi

          # Preflight: refuse to delete any unreviewed branch names.
          while IFS=$'\t' read -r sha ref; do
            [[ -z "$ref" || "$ref" == "refs/heads/main" ]] && continue
            current="${ref#refs/heads/}"
            found=false
            for item in "${branches[@]}"; do
              if [[ "$current" == "$item" ]]; then found=true; break; fi
            done
            if [[ "$found" != "true" ]]; then
              echo "Aborting: unexpected branch: $current" >&2
              exit 1
            fi
          done < <(git ls-remote --heads origin)

          # Preflight: require ALL branch tips to be ancestors of the merged main
          # and reject any modifications of the previously audited four heads.
          current_shas=()
          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"
            current="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            current_shas+=("$current")
            [[ -z "$current" ]] && continue
            if [[ -n "${expected[$i]}" && "$current" != "${expected[$i]}" ]]; then
              echo "Aborting: $branch changed since the branch audit." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
              echo "Aborting: $branch is not integrated in main." >&2
              exit 1
            fi
          done

          # Delete with exact SHA leases to guard against concurrent pushes.
          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"
            current="${current_shas[$i]}"
            [[ -z "$current" ]] && continue
            echo "Pruning verified merged branch: $branch"
            git push origin --force-with-lease="refs/heads/$branch:$current" ":refs/heads/$branch"
          done

          remaining="$(git ls-remote --heads origin | awk '$2!="refs/heads/main"')"
          if [[ -n "$remaining" ]]; then
            echo "Cleanup incomplete: non-main branches remain:" >&2
            echo "$remaining" >&2
            exit 1
          fi
          echo "Verified: only main remains."
